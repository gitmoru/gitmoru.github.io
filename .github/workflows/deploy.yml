# GitHub Pages 로 올린다.
#
# 이 사이트는 전부 정적이다. 서버가 할 일이 없으니 서버를 두지 않는다.
# 남의 플랫폼을 끼우면 그쪽이 방문 기록을 갖게 되는데, 우리는 화면에
# "분석 도구를 쓰지 않습니다" 라고 적어뒀다. 그 말과 어긋나지 않는 쪽을 골랐다.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 올리는 중에 또 올리지 않는다. 다만 진행 중인 건 끊지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 타입이 깨진 채로 올리지 않는다. 빌드만으로는 빈 화면을 못 잡는다.
      - run: pnpm check

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
